name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi
          pip install pytest

      - name: Run tests
        run: |
          pytest -q

  build-sandbox:
    name: Build Sandbox Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build sandbox image
        run: |
          docker build -f sandbox/Dockerfile -t i-project-sandbox:ci .

      - name: Build docker-compose sandbox (best-effort)
        run: |
          if [ -f docker-compose.sandbox.yml ]; then docker-compose -f docker-compose.sandbox.yml build || true; fi
