name: ai-school CI

on:
  push:
    paths:
      - "api_service/ai-school/**"
  pull_request:
    paths:
      - "api_service/ai-school/**"
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r api_service/ai-school/requirements.txt
      - name: Run smoke
        run: |
          python api_service/ai-school/run_ordered_prompt.py
