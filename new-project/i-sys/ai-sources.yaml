# ai-sources.yaml - configuration of local AI sources for i-sys
# This file lists local endpoints and preferred models for quick reference.
ollama:
  url: "http://localhost:11434"
  default_model: "mistral"

aider:
  endpoint: "http://localhost:8000"
  paths:
    - "/ask"
    - "/generate"

# Notes:
# - Place this file under i-sys for tools to read when constructing test requests.
# - It's intentionally minimal; scripts prefer .env values but will fall back to these.
